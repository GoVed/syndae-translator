services:
  syndae-translator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syndae-translator-connector
    restart: unless-stopped
    ports:
      - "8772:8772"
    environment:
      - TRANSLATION_BACKEND=${TRANSLATION_BACKEND:-openai_compatible}
      - TRANSLATION_API_URL=${TRANSLATION_API_URL:-http://host.docker.internal:8080/v1}
      - TRANSLATION_MODEL=${TRANSLATION_MODEL:-/models/Huihui-Qwen3.8-27B-abliterated-UD-IQ3_S.gguf}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - HTTP_PORT=8772
      - HTTP_HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SYNDAE_API_URL=http://host.docker.internal:3000
      - SYNDAE_ACCESS_KEY=${SYNDAE_ACCESS_KEY:-syndae-local-dev-key}
    volumes:
      - ./instructions.md:/app/instructions.md:ro
      - ./manifest.json:/app/manifest.json:ro
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8772/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
